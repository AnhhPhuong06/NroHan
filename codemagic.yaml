workflows:
  ios-unsigned:
    name: NroHan - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "16.4"
    scripts:
      - name: Download Git LFS libraries
        script: |
          set -euo pipefail
          git lfs pull
      - name: Build and package unsigned IPA
        script: bash scripts/build_unsigned_ipa.sh
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/logs/*.log
      - build/ios/unsigned.xcarchive/dSYMs/**/*.dSYM
